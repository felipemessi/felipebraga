# Internal links and anchors only, checked against the built artifact (dist/).
# root_dir must be absolute, so the workflow passes --root-dir.
offline = true
include_fragments = "full"
fallback_extensions = ["html"]
no_progress = true

# The layout shell (1.3) links routes that later features create. Remove each
# entry when its page exists: /blog (2.x), /tags (2.x), /me-contrate (2.5),
# /rss.xml (feeds).
exclude = ['/(blog|tags|me-contrate|rss\.xml)$']
