sonar.projectKey=felipemessi_felipebraga
sonar.organization=felipemessi

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.test.exclusions=tests/fixtures/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Logic is in src/lib and is the only code Vitest measures. The rest is I/O
# wiring or markup, exercised by the build and e2e, not by Vitest.
sonar.coverage.exclusions=src/pages/**,src/layouts/**,src/components/**,src/content.config.ts,scripts/**

# docs/, design/, infra/ and public/admin/ are outside sonar.sources/tests;
# listed so a future change of sources does not pull them in.
sonar.exclusions=docs/**,design/**,infra/**,src/content/**,public/admin/**,**/*.astro
