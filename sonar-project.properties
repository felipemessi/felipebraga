sonar.projectKey=felipemessi_felipebraga
# Assumed from the "<organization>_<repo>" key convention; confirm on the first run.
sonar.organization=felipemessi

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# docs/, design/, infra/ and public/admin/ are outside sonar.sources/tests;
# listed so a future change of sources does not pull them in.
# I/O wiring with no logic (the logic is in src/lib); exercised by the build and e2e, not by Vitest.
sonar.coverage.exclusions=scripts/**,src/content.config.ts
sonar.exclusions=docs/**,design/**,infra/**,src/content/**,tests/fixtures/**,public/admin/**,**/*.astro
