version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    ignore:
      # astro check refuses TS 7 and typescript-eslint needs < 6.1 (see AGENTS.md).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/cloudflare
      - /infra/github
    target-branch: develop
    schedule:
      interval: weekly
