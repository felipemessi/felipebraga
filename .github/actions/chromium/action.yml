name: Chromium
description: Install Playwright's Chromium (cached) for the build, which renders Mermaid diagrams to SVG. Run after the setup action.

runs:
  using: composite
  steps:
    - id: playwright-version
      run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Chromium and system dependencies
      if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - name: Install system dependencies only
      if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
